<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #fdfdfd;
      font-family: 'Georgia', serif;
      color: #3f5132;
    }

    .contact-section {
      padding: 5rem 2rem;
    }

    .contact-title {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 0.5rem;
      margin-bottom: 2rem;
    }

    .contact-info h5 {
      font-style: italic;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .social-icons i {
      font-size: 1.2rem;
      margin-right: 0.5rem;
    }

    input.form-control, textarea.form-control {
      border: 1px solid #3f5132;
      border-radius: 0;
      box-shadow: none;
    }

    input.form-control:focus, textarea.form-control:focus {
      border-color: #3f5132;
      box-shadow: none;
    }

    input.form-control.email-field {
      background-color: #cbd8c5;
    }

    .submit-btn {
      background-color: transparent;
      border: 1px solid #3f5132;
      color: #3f5132;
      font-weight: 600;
      padding: 0.5rem 2rem;
    }

    .submit-btn:hover {
      background-color: #3f5132;
      color: white;
    }

    .left-divider {
      border-top: 1px solid #3f5132;
      width: 20px;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="container contact-section">
    <div class="row">
      <!-- Left Side -->
      <div class="col-md-5 mb-4">
        <div class="contact-title">CONTACT</div>
        <div class="contact-info">
          <h5>Jake Johnson</h5>
          <div class="left-divider"></div>
          <div class="social-icons mb-2">
            <i class="bi bi-instagram"></i> JakeJohnson
          </div>
          <div class="social-icons">
            <i class="bi bi-facebook"></i> Jake Johnson
          </div>
        </div>
      </div>

      <!-- Right Side -->
      <div class="col-md-7">
        <form>
          <div class="mb-3">
            <label class="form-label">First Name *</label>
            <input type="text" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Last Name *</label>
            <input type="text" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control email-field" />
          </div>
          <div class="mb-3">
            <label class="form-label">Subject *</label>
            <input type="text" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Message *</label>
            <textarea rows="4" class="form-control"></textarea>
          </div>
          <button type="submit" class="submit-btn">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</body>
</html>

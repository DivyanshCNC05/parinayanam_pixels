<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Index | Parinayanam Pixels</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your CSS -->
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <!-- Carousel Section -->
  <div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="2000">
    <div class="carousel-inner">

      <!-- Slide 1 -->
      <div class="carousel-item active" data-bs-interval="2000">
        <!-- Desktop image (shown md and up) -->
        <img src="./assets/lg-collage.png" class="desktop-img d-none d-md-block w-100" alt="Desktop Image 1">
        <!-- Mobile image (shown below md) -->
        <img src="./assets/sm-collage.png" class="mobile-img d-block d-md-none w-100" alt="Mobile Image 1">
      </div>

      <!-- Slide 2 -->
      <div class="carousel-item" data-bs-interval="2000">
        <img src="./assets/lg-collage-2.png" class="desktop-img d-none d-md-block w-100" alt="Desktop Image 2">
        <img src="./assets/sm-collage-2.png" class="mobile-img d-block d-md-none w-100" alt="Mobile Image 2">
      </div>

    </div>

    <!-- Optional controls (uncomment if you want) -->
    <!--
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
    -->

    <!-- Center Button over slides -->
    <div class="carousel-center-btn">
      <a href="home.html" class="btn enter-btn">Enter Website</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

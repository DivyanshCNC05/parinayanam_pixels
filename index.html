<html lang="en">

<head>

<body>

  <!-- Carousel Section -->
  <div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="2000">
    <div class="carousel-inner">

      <!-- Slide 1 -->
      <div class="carousel-item active" data-bs-interval="2000">
        <!-- Desktop image (shown md and up) -->
        <img src="./assets/lg-collage.png" class="desktop-img d-none d-md-block w-100" alt="Desktop Image 1">
        <!-- Mobile image (shown below md) -->
        <img src="./assets/sm-collage.png" class="mobile-img d-block d-md-none w-100" alt="Mobile Image 1">
      </div>

      <!-- Slide 2 -->
      <div class="carousel-item" data-bs-interval="2000">
        <img src="./assets/lg-collage-2.png" class="desktop-img d-none d-md-block w-100" alt="Desktop Image 2">
        <img src="./assets/sm-collage-2.png" class="mobile-img d-block d-md-none w-100" alt="Mobile Image 2">
      </div>

    </div>

    <!-- Optional controls (uncomment if you want) -->

    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
